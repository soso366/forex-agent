# Strategy Discovery — registre des fiches (23/10/2026). Scores selon GRILLE.md, fixée avant la recherche.
# Les résultats cités sont ceux PUBLIÉS par les sources ; aucun backtest du projet n'a été lancé pour ce classement.
fiches:
  - id: D01
    nom: "Suivi de tendance / momentum de série temporelle (12 mois)"
    famille: tendance
    sources:
      - "Moskowitz, Ooi, Pedersen (2012), Time Series Momentum, Journal of Financial Economics 104"
      - "Hurst, Ooi, Pedersen (2017), A Century of Evidence on Trend-Following Investing, Journal of Portfolio Management (AQR)"
      - "AQR, Trends Everywhere (2018) : test hors échantillon sur de nouveaux actifs, dont devises émergentes"
      - "AQR, You Can't Always Trend When You Want (2019) : indice SG Trend Sharpe 0,05 sur 2010-2018 contre 0,28 depuis 2000"
    regles: "Chaque fin de mois : signe du rendement de la paire sur 12 mois (ou 1, 3 et 12 mois combinés) ; achat si positif, vente si négatif ; taille inverse de la volatilité ; position tenue 1 mois."
    resultats_publies: "Rentable sur plus d'un siècle et sur 67 marchés dont les devises du G10 ; après frais estimés ; nettement affaibli depuis 2010 (Sharpe de l'indice SG Trend ≈ 0,05 sur 2010-2018)."
    limites: "Horizon mensuel (positions de plusieurs semaines, nuits et week-ends) ; l'avantage vient de la diversification sur des dizaines de marchés, pas de 3 paires ; affaiblissement récent signalé par l'auteur lui-même ; peu de trades par an (≈ 12 par paire)."
    scores: {S: 3, H: 3, C: 2, R: 2, I: 3, F: 3, P: 2}
    penalites: {effet_en_declin: true}
    compatibilite: {horizon: "mensuel (incompatible ≤ 4 h)", paires: "oui, mais preuve sur panier large", donnees: "oui (Dukascopy journalier)", cout_sensibilite: "faible (gain par trade de centaines de pips)"}
    doublon_de: null
    fait_nouveau: "Distinct de X03 Turtle (cassure Donchian 20/55 jours, rejetée surtout pour l'horizon) et de F02 (moyenne mobile H1) : signal 12 mois, preuve académique sur un siècle."
    mots_cles: [["momentum", "12 mois"], ["time series momentum"]]

