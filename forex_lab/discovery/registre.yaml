  - id: D05
    nom: "Couverture actions avant le fix de Londres de fin de mois"
    famille: flux
    sources:
      - "Melvin, Prins (2015), Equity Hedging and Exchange Rates at the London 4 p.m. Fix, Journal of Financial Markets 22"
      - "Notes mensuelles de praticiens (Barclays, BNY iFlow, Crédit Agricole) — sans historique audité"
    regles: "Si les actions étrangères ont fortement monté sur le mois, la devise étrangère tend à baisser avant le fix de 16:00 Londres du dernier jour ouvré (rééquilibrage des couvertures). Règles détaillées non récupérées."
    resultats_publies: "Effet statistiquement significatif dans l'étude ; ampleur, période et coûts non récupérés ici."
    limites: "12 occasions par an ; détails de la fenêtre manquants ; effet connu de tous les desks depuis 2015 ; les notes de praticiens n'ont pas d'historique vérifiable."
    scores: {S: 3, H: 0, C: 0, R: 1, I: 1, F: 1, P: 1}
    compatibilite: {horizon: "intrajournalier (≤ 4 h avant 16:00 Londres)", paires: "oui", donnees: "oui (Dukascopy + indices actions)", cout_sensibilite: "inconnue"}
    doublon_de: null
    fait_nouveau: "E000 rejette le fade APRÈS le fix ; ici le pari est directionnel AVANT le fix, fin de mois seulement, piloté par les actions."
    mots_cles: [["fix", "fin de mois"], ["fixing", "fade"]]

