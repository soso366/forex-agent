  - id: D03
    nom: "Dollar avant les changements de taux de la Fed (FOMC)"
    famille: evenement
    sources:
      - "Karnaukh (2018), The Dollar Ahead of FOMC Target Rate Changes, document de travail SSRN"
    regles: "3 jours avant le FOMC, changement attendu du taux d'après les contrats à terme sur fed funds du mois suivant : ≥ +12,5 pb → acheter USD, ≤ −12,5 pb → vendre USD ; entrée 14:00 (heure de New York) deux jours avant, sortie 14:00 le jour de l'annonce ; panier EUR, GBP, CHF, JPY contre USD."
    resultats_publies: "1994-2014 : 57 trades, +25 pb par trade, Sharpe 0,93 (t 2,8) avant coûts ; après coûts estimés +15 pb, Sharpe 0,57."
    limites: "Pas de test hors échantillon formel ; données s'arrêtant en 2014 ; peu de trades (≈ 3 par an) ; demande les contrats à terme sur fed funds (disponibilité gratuite incertaine) ; positions de 2 jours."
    scores: {S: 2, H: 0, C: 2, R: 1, I: 0, F: 2, P: 2}
    compatibilite: {horizon: "2 jours (incompatible ≤ 4 h)", paires: "oui (EUR, GBP, JPY dans le panier)", donnees: "incertain (fed funds futures)", cout_sensibilite: "faible (≈ 25 pips par trade)"}
    doublon_de: null
    mots_cles: [["fomc", "fed funds"]]

  - id: D04
    nom: "Vente du dollar les jours d'annonce FOMC"
    famille: evenement
    sources:
      - "Mueller, Tahbaz-Salehi, Vedolin (2017), Exchange Rates and Monetary Policy Uncertainty, Journal of Finance 72"
    regles: "Vendre le dollar contre les autres devises le jour d'une annonce FOMC programmée ; effet plus fort pour les devises à taux élevé et en période de baisse des taux."
