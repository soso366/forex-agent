# ============================================================
# Agent de trading Forex autonome — V1 (PAPER TRADING UNIQUEMENT)
# Tout est configurable ici ; rien n'est en dur dans le code.
# ============================================================

mode: paper                    # V1 : "paper" uniquement. Aucun broker réel.

account:
  currency: EUR
  starting_capital: 50.0       # capital de référence
  leverage: 30                 # levier retail UE sur les majeures (ESMA)
  commission_per_lot_eur: 0.0  # 0 = broker "spread only" (type OANDA)

data:
  provider: synthetic          # synthetic | csv | oanda
  csv_dir: data/m1             # CSV M1 bid/ask (ex. Dukascopy) : <SYMBOL>.csv
  synthetic:
    seed: 7
    start: "2026-09-01"
    days: 30
  oanda:                       # lecture seule des prix (compte démo), jamais d'ordres
    environment: practice
    token_env: OANDA_TOKEN

symbols: [EURUSD, GBPUSD, USDJPY]

timeframes:
  context: [H1, M15]           # compréhension du contexte
  entry: [M5, M1]              # timing et entrée
bars:                          # bougies clôturées chargées par timeframe
  H1: 120
  M15: 160
  M5: 150
  M1: 60

scheduler:
  interval_minutes: 5
  delay_seconds: 15            # attendre la clôture de la bougie M5
  # Forex fermé du vendredi 21:00 UTC au dimanche 21:00 UTC (approximation, DST non gérée en V1)
  weekly_close: {weekday: 4, hour: 21}
  weekly_open:  {weekday: 6, hour: 21}

sessions:
  # Heures UTC où l'OUVERTURE de nouvelles positions est autorisée (Londres + New York).
  # La gestion des positions ouvertes continue en dehors.
  new_trades_utc: [[7, 20]]
  no_new_trades_friday_after_utc: 19
  asia_utc: [0, 7]             # range Asie (liquidité balayée ensuite par Londres — ICT)
  killzones_ny:                # heures de New York (DST gérée automatiquement)
    london: [2, 5]
    new_york_am: [7, 10]

news:                          # aucune nouvelle position autour des annonces (ICT, NNFX)
  blackout_minutes_before: 30
  blackout_minutes_after: 30
  auto_nfp: true               # NFP : 1er vendredi du mois, 8:30 New York
  events: []                   # à remplir : {time: "2026-10-28T18:00Z", name: FOMC, currencies: [USD]}

trading:
  max_hold_minutes: 30         # fermeture automatique au plus tard après 30 min
  max_new_trades_per_cycle: 1
  # Entrée BINAIRE (NNFX) : toutes les conditions essentielles de la stratégie sont vraies,
  # sinon NO TRADE. Les confirmations optionnelles sont journalisées pour être pondérées
  # plus tard par les statistiques, pas par des poids arbitraires.
  min_optional_confirmations: 0
  allow_experimental_in_paper: true   # stratégies "experimental" autorisées en paper seulement
  reentry_cooldown_minutes: 30 # après une perte sur une paire : pas de nouvelle entrée dessus (pas de chase)

strategy_params:
  stop_buffer_atr: 0.5         # stop = invalidation ± 0,5 ATR M5 (les sources disent 1 ATR en Daily : à tester)
  min_pullback_pct: 0.30       # pullback ≥ 30 % de la jambe (Wysetrade : 50 % = meilleur)
  max_pullback_pct: 0.786
  displacement_atr: 1.0        # corps minimal d'une bougie de displacement (ICT)
  opposite_displacement_atr: 1.5   # « d'où vient le prix » : impulsion contraire récente = pas de trade
  flag_pole_atr: 2.5           # hauteur minimale du mât d'un flag
  # Constantes rendues paramétrables pour le Parameter Lab (valeurs identiques à la V2) :
  target_offset_atr: 0.05      # la cible s'arrête 0,05 ATR + spread avant le niveau visé
  target_min_spreads: 2.0      # un niveau à moins de 2 spreads n'est pas une cible
  displacement_close_pos: 0.7  # bougie de displacement : clôture dans les 30 % extrêmes
  tp_min_leg_atr: 2.0          # TrendPullback : jambe d'impulsion minimale
  tp_leg_lookback: 30          # TrendPullback : fenêtre M5 de recherche de la jambe
  tp_value_zone_atr: 0.3       # TrendPullback : tolérance autour EMA20/EMA50/ancien niveau
  br_level_lookback_m15: 48    # BreakRetest : swings M15 des 12 dernières heures
  br_break_min_atr: 0.1        # BreakRetest : clôture minimale au-delà du niveau
  br_hold_bars: 6              # BreakRetest : bougies M5 où le niveau devait tenir avant la cassure
  br_zone_atr: 0.25            # BreakRetest : largeur de la zone de retest
  br_fall_through_atr: 0.1     # BreakRetest : réintégration tolérée
  br_strong_break_atr: 0.3     # BreakRetest : cassure « franche »
  br_break_displacement: 0.6   # BreakRetest : corps minimal de la bougie de cassure
  flag_max_range_ratio: 0.5    # Flag : amplitude max du drapeau / mât
  flag_max_retrace: 0.5        # Flag : correction max du mât
  flag_ema_tol_atr: 0.2        # Flag : tolérance sous/au-dessus de l'EMA20
  flag_break_body_atr: 0.5     # Flag : corps minimal de la bougie de cassure
  dt_retest_atr: 0.25          # DoubleTop/Bottom : tolérance du retour sur neckline
  dt_min_separation: 4         # DoubleTop/Bottom : bougies minimales entre les deux sommets/creux
  sweep_beyond_atr: 0.05       # SweepMSS : mèche minimale au-delà de la liquidité
  sweep_lookback: 8            # SweepMSS : fenêtre de recherche du sweep (M5)
  sweep_clean_bars: 12         # SweepMSS : le niveau doit être intact avant
  fvg_min_atr: 0.0             # SweepMSS : taille minimale de FVG (0 = toute FVG)
  fvg_entry_tol_atr: 0.1       # SweepMSS : tolérance autour de la FVG pour l'entrée
  rf_edge_pct: 0.15            # RangeFade : zone de borne (% de la largeur)
  rf_wick_pct: 0.5             # RangeFade : mèche de rejet minimale (% de la bougie)

regime:                        # définition des régimes (valeurs identiques à la V2)
  vol_extreme_ratio: 2.5
  vol_high_ratio: 1.5
  vol_low_ratio: 0.7
  dead_atr_spread_mult: 1.2
  er_trend_min: 0.30
  er_range_max: 0.25
  er_strong: 0.5
  range_width_atr_min: 3.0
  range_width_atr_max: 15.0
  range_touches_min: 2
  range_touch_band: 0.15
  fresh_max_bos: 3
  fresh_max_ext_atr: 2.5
  equal_level_tol_atr: 0.1

strategies:                    # statut : experimental | paper_validated | live_validated
  TrendPullback_v2:   {enabled: true, status: experimental}
  BreakRetest_v2:     {enabled: true, status: experimental}
  FlagBreakout_v1:    {enabled: true, status: experimental}
  DoubleTopBottom_v1: {enabled: true, status: experimental}
  SweepMSS_v2:        {enabled: true, status: experimental}
  RangeFade_v2:       {enabled: true, status: experimental}

risk:
  risk_per_trade_pct: 1.0      # 1 % du capital par trade (0,50 € à 50 €)
  max_total_risk_pct: 2.0      # risque cumulé max de toutes les positions ouvertes
  max_open_positions: 2
  max_trades_per_day: 12
  daily_loss_limit_pct: 3.0    # au-delà : plus de nouvelles positions ce jour-là
  max_drawdown_pct: 20.0       # depuis le plus haut : kill switch automatique
  max_consecutive_losses: 3
  cooldown_minutes_after_losses: 60
  reduced_risk_pct_after_losses: 0.5   # le risque ne peut que BAISSER après des pertes
  min_rr: 1.5
  min_stop_pips: 3.0
  max_stop_pips: 20.0
  max_spread_pips: {default: 2.0, GBPUSD: 2.5, USDJPY: 2.0}
  max_spread_to_stop_ratio: 0.25
  max_margin_usage_pct: 60.0
  min_units: 1                 # OANDA accepte 1 unité ; broker MT4 : 1000 (micro-lot)
  unit_step: 1
  block_same_currency_same_direction: true

management:
  breakeven_at_r: 1.0          # à +1R : stop au prix d'entrée (+ spread)
  lock_at_r: 1.5               # à +1,5R : stop verrouille +0,5R
  lock_r: 0.5
  trail_ema20_after_r: 1.0     # au-delà : trailing sous/au-dessus de l'EMA20 M5 (vidéo technical analysis)
  take_profit_near_target: 0.8 # ≥ 80 % du chemin + momentum qui s'essouffle -> TAKE PROFIT
  opposite_displacement_atr: 1.2   # bougie M5 contraire de cette taille = invalidation narrative (ICT)
  regime_flip_exit: true       # CLOSE si le régime passe contre la position ou VOLATILE
  chop_exit: true              # CLOSE si CHOP et position en perte (sauf RangeFade/SweepMSS)
  momentum_exit_r: -0.3        # CLOSE si momentum M5 contre ET position sous ce R
  momentum_rsi_band: 5         # « momentum contre » = RSI M5 à plus de 5 points du 50 dans le mauvais sens
  trail_offset_atr: 0.3        # trailing = EMA20 M5 -/+ 0,3 ATR

llm:
  enabled: false               # true = Claude relit les candidats et les positions
  model: claude-sonnet-5-5
  max_tokens: 1500
  api_key_env: ANTHROPIC_API_KEY

paths:
  db: data/journal.sqlite
  jsonl: data/cycles.jsonl
  kill_switch: data/KILL_SWITCH
  lock: data/agent.lock
  prompt: prompts/agent_system.md
  playbook: knowledge/playbook.md
