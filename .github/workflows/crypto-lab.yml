# Strategy Research Lab — backtests crypto (simulation uniquement, aucun ordre réel, aucune clé d'exchange).
# Sécurité : le job qui exécute du code de stratégie externe n'a AUCUN secret et un jeton en lecture seule.
# Un second job, sans code externe, enregistre uniquement les fichiers de résultats sur la branche research-crypto.
name: Crypto Lab — backtests

on:
  push:
    branches: [research-crypto]
    paths: ["crypto_lab/**", "!crypto_lab/results/**", ".github/workflows/crypto-lab.yml"]
  workflow_dispatch:

concurrency:
  group: crypto-lab
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Installation de Freqtrade
        run: |
          pip install -q freqtrade pyyaml
          freqtrade --version | tee freqtrade_version.txt
      - name: Choix de l'exchange (liste des marchés, sans clé)
        run: python crypto_lab/pick_exchange.py
      - name: Liste des paires du plan
        id: pairs
        run: |
          P=$(python -c "import yaml;print(' '.join(sorted({p for r in yaml.safe_load(open('crypto_lab/run.yaml'))['runs'] for p in r['pairs']})))")
          echo "list=$P" >> "$GITHUB_OUTPUT"
          echo "key=$(echo "$P" | md5sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Cache des données
        uses: actions/cache@v4
        with:
          path: user_data/data/binance
          key: binance-spot-5m-1h-2022-12-2026-09-${{ steps.pairs.outputs.key }}
          restore-keys: binance-spot-5m-1h-2022-12-2026-09-
      - name: Données Binance publiques (5m, 1h)
        run: |
          MISSING=""
          for P in ${{ steps.pairs.outputs.list }}; do
            [ -f "user_data/data/binance/${P/\//_}-5m.json" ] || MISSING="$MISSING $P"
          done
          if [ -n "$MISSING" ]; then
            python crypto_lab/fetch_data.py --pairs $MISSING --timeframes 5m 1h --start 2022-12 --end 2026-09 \
              --out user_data/data/binance_new
            mkdir -p user_data/data/binance && cp user_data/data/binance_new/*.json user_data/data/binance/
            cp user_data/data/binance_new/_rapport_donnees.json user_data/data/binance/_rapport_donnees.json
          fi
          EX=$(python -c "import json;print(json.load(open('exchange_choice.json'))['name'])")
          [ "$EX" = binance ] || cp -r user_data/data/binance user_data/data/$EX
          cat user_data/data/binance/_rapport_donnees.json
      - name: Backtests du plan (crypto_lab/run.yaml)
        run: python crypto_lab/run_batch.py
      - name: Résumé
        if: always()
        run: |
          mkdir -p out && for f in crypto_lab/results/*.md; do [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"; done; true
          cp crypto_lab/results/*.md crypto_lab/results/*.json out/ 2>/dev/null || true
          cp freqtrade_version.txt exchange_choice.json user_data/data/binance/_rapport_donnees.json out/ 2>/dev/null || true
          mkdir -p out/logs && for f in logs/*.log; do [ -f "$f" ] && tail -n 80 "$f" > "out/logs/$(basename "$f")"; done; true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: resultats, path: out/, retention-days: 30}

  enregistrer:
    needs: backtest
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {ref: research-crypto}
      - uses: actions/download-artifact@v4
        with: {name: resultats, path: out}
        continue-on-error: true
      - name: Enregistrer uniquement les résultats
        run: |
          mkdir -p crypto_lab/results/details
          # copie stricte : seulement des fichiers .json / .md / .txt / .log, vers des dossiers fixes
          find out -type f \( -name '*.json' -o -name '*.md' -o -name '*.txt' -o -name '*.log' \) -print0 |
            while IFS= read -r -d '' f; do cp "$f" "crypto_lab/results/details/$(basename "$f")"; done
          for f in out/*.md out/*.json; do [ -f "$f" ] && cp "$f" crypto_lab/results/; done; true
          git config user.name "crypto-lab[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto_lab/results
          git diff --cached --quiet || git commit -qm "Crypto Lab : résultats (run ${{ github.run_id }})"
          git push -q origin HEAD:research-crypto
