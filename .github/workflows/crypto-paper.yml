# Paper trading « en avant » (gratuit) du robot crypto — simulation uniquement, aucun ordre réel, aucune clé d'exchange.
# Chaque jour, rejoue la stratégie de crypto_lab/paper.yaml sur les bougies Binance publiées depuis le départ.
# Sécurité : le job qui exécute le code de stratégie externe n'a aucun secret et un jeton en lecture seule ;
# un second job, sans code externe, enregistre uniquement les fichiers du dossier crypto_lab/paper/.
name: Crypto — paper trading quotidien

on:
  schedule:
    - cron: "23 0 * * *"      # chaque nuit à 00:23 UTC (02:23 à Paris en été)
  workflow_dispatch:
  push:
    branches: [research-crypto]
    paths: ["crypto_lab/paper_run.py", "crypto_lab/paper.yaml", ".github/workflows/crypto-paper.yml"]

concurrency:
  group: crypto-paper
  cancel-in-progress: false

jobs:
  rejouer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {ref: research-crypto, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: crypto_lab/paper.yaml}
      - name: Installation de Freqtrade
        run: pip install -q freqtrade pyyaml
      - name: Choix de l'exchange (liste des marchés, sans clé)
        run: python crypto_lab/pick_exchange.py
      - name: Rejeu du paper trading
        run: python crypto_lab/paper_run.py
      - name: Résumé
        if: always()
        run: |
          [ -f crypto_lab/paper/JOURNAL.md ] && cat crypto_lab/paper/JOURNAL.md >> "$GITHUB_STEP_SUMMARY" || true
          mkdir -p out && cp crypto_lab/paper/*.md crypto_lab/paper/*.json out/ 2>/dev/null || true
          [ -f paper_backtest.log ] && tail -n 60 paper_backtest.log > out/paper_backtest.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: paper, path: out/, retention-days: 14}

  enregistrer:
    needs: rejouer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {ref: research-crypto}
      - uses: actions/download-artifact@v4
        with: {name: paper, path: out}
      - name: Enregistrer uniquement le journal
        run: |
          mkdir -p crypto_lab/paper
          for f in out/JOURNAL.md out/etat.json out/trades.json; do [ -f "$f" ] && cp "$f" crypto_lab/paper/; done
          git config user.name "crypto-paper[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto_lab/paper
          git diff --cached --quiet || git commit -qm "Paper trading crypto : mise à jour du $(date -u +%Y-%m-%d)"
          git pull -q --rebase origin research-crypto && git push -q origin HEAD:research-crypto
