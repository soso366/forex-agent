# Télécharge les données publiques gratuites (FRED, Réserve fédérale de St. Louis) du test D01 « suivi de tendance »
# et les enregistre dans forex_lab/trend/data/. Aucune clé, aucun secret, aucun code externe exécuté.
name: Forex — données du test tendance

on:
  workflow_dispatch:
  push:
    branches: [research-forex-oss]
    paths: [".github/workflows/trend-data.yml"]

permissions:
  contents: write

concurrency:
  group: trend-data
  cancel-in-progress: false

jobs:
  telecharger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: research-forex-oss}
      - name: Téléchargement FRED (plusieurs adresses, diagnostic des erreurs)
        run: |
          set -uo pipefail
          D=forex_lab/trend/data; mkdir -p $D
          get() {  # $1 = fichier, $2 = adresse
            code=$(curl -sSL -m 90 -A "curl/8 (research; github-actions)" -w "%{http_code}" -o "$1" "$2" 2>/tmp/err) || true
            echo "::notice::$(basename $1) HTTP $code $(head -c 120 "$1" 2>/dev/null | tr '\n' ' ') $(cat /tmp/err | head -c 150)"
            [ "$code" = 200 ]
          }
          for s in DEXUSEU DEXUSUK DEXJPUS TB3MS IR3TIB01EZM156N IR3TIB01GBM156N IR3TIB01JPM156N; do
            get $D/$s.csv "https://fred.stlouisfed.org/graph/fredgraph.csv?id=$s" && head -1 $D/$s.csv | grep -q "$s" && continue
            sleep 5
            get $D/$s.csv "https://fred.stlouisfed.org/graph/fredgraph.csv?id=$s&cosd=1971-01-01" && head -1 $D/$s.csv | grep -q "$s" && continue
            rm -f $D/$s.csv
          done
          # Sources de secours, gratuites : BCE (cours de référence depuis 1999), Stooq (historique long)
          for c in USD GBP JPY; do
            get $D/ECB_$c.csv "https://data-api.ecb.europa.eu/service/data/EXR/D.$c.EUR.SP00.A?format=csvdata" || rm -f $D/ECB_$c.csv
          done
          get $D/ECB_EURIBOR3M.csv "https://data-api.ecb.europa.eu/service/data/FM/M.U2.EUR.RT.MM.EURIBOR3MD_.HSTA?format=csvdata" || rm -f $D/ECB_EURIBOR3M.csv
          for s in eurusd gbpusd usdjpy; do
            get $D/STOOQ_$s.csv "https://stooq.com/q/d/l/?s=$s&i=d" || rm -f $D/STOOQ_$s.csv
          done
          ls -la $D
          date -u +"%Y-%m-%dT%H:%M:%SZ" > $D/TELECHARGE_LE.txt
      - name: Enregistrement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forex_lab/trend/data
          git commit -m "data(trend): données FRED du test D01 [skip ci]" || exit 0
          git push origin HEAD:research-forex-oss
