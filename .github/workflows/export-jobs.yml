# Téléchargement Dukascopy M1 BID/ASK générique (recherche, simulation uniquement).
# Une ligne par lot dans deploy/trigger/export_jobs.txt : « SYMBOLES(virgule) DÉBUT FIN TAG »,
# ex. « EURUSD 2015-01-01 2015-06-30 eurusd-2015h1 ». Les CSV compressés sont publiés en Artifacts.
# Relancer (modifier le fichier) reprend grâce au cache.
name: Export données (lots)

on:
  push:
    branches: [research/calm-pairs, research/documented-strategies]
    paths: [deploy/trigger/export_jobs.txt]

permissions:
  contents: write   # pour enregistrer les RÉSULTATS des backtests (pas les données) dans la branche

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          rows = []
          for line in open("deploy/trigger/export_jobs.txt"):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              s, a, b, t = line.split()
              rows.append({"symbols": s.replace(",", " "), "start": a, "end": b, "tag": t})
          print("matrix=" + json.dumps({"job": rows}))
          EOF
  export:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data/dukascopy_raw
          key: jobs-${{ matrix.job.tag }}-${{ github.run_id }}
          restore-keys: jobs-${{ matrix.job.tag }}-
      - name: Télécharger / préparer
        env: {PYTHONUNBUFFERED: "1"}
        run: |
          # Reprises dans le même job : Dukascopy renvoie parfois des erreurs passagères.
          for i in 1 2 3 4 5 6; do
            python -m forex_agent data-download --symbols ${{ matrix.job.symbols }} --start ${{ matrix.job.start }} --end ${{ matrix.job.end }} --time-budget-min 50 || true
            S=$(head -1 data/download_status.txt 2>/dev/null || echo "?")
            echo "Essai $i : $S"
            [ "$S" = "COMPLETE" ] && break
            sleep 30
          done
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: data/dukascopy_raw
          key: jobs-${{ matrix.job.tag }}-${{ github.run_id }}
      - id: out
        run: |
          STATUS=$(head -1 data/download_status.txt 2>/dev/null || echo "?")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          [ "$STATUS" = "COMPLETE" ] || { echo "::warning::Incomplet — relancer en modifiant le fichier déclencheur"; exit 0; }
          mkdir -p out
          for f in data/m1/*.csv; do gzip -9 -c "$f" > "out/$(basename "$f" .csv)_${{ matrix.job.tag }}.csv.gz"; done
          cp data/m1/quality_report.json "out/quality_${{ matrix.job.tag }}.json"
      - uses: actions/upload-artifact@v4
        if: steps.out.outputs.status == 'COMPLETE'
        with:
          name: data-${{ matrix.job.tag }}
          path: out
          retention-days: 7

  backtest:
    # Lance le protocole des 10 méthodes documentées sur toutes les données, puis enregistre les résultats.
    needs: export
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: data-eurusd-*
          path: lab/documented/data
          merge-multiple: true
      - name: Vérifier que tous les lots EUR/USD demandés sont complets
        run: |
          W=$(grep -v '^#' deploy/trigger/export_jobs.txt | grep -c 'eurusd-')
          N=$(ls lab/documented/data/EURUSD_eurusd-*.csv.gz 2>/dev/null | wc -l)
          echo "Lots présents : $N / $W"
          [ "$N" -eq "$W" ] || { echo "::error::Données incomplètes ($N/$W) : backtest non lancé. Relancer le fichier déclencheur."; exit 1; }
      - name: Données EUR/USD 09/2024 → 08/2026 (dépôt privé forex-data)
        env:
          DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          mkdir -p /tmp/fd && cd /tmp/fd && git init -q
          git remote add origin "https://x-access-token:${DATA_TOKEN}@github.com/soso366/forex-data.git"
          for b in data-2024sep-2025feb data-2025mar-aug data-2025sep-2026feb data-2026mar-aug; do
            git fetch -q --depth 1 origin "$b"
            git show FETCH_HEAD:EURUSD.csv.gz > "$GITHUB_WORKSPACE/lab/documented/data/EURUSD_${b}.csv.gz"
          done
          ls -la "$GITHUB_WORKSPACE/lab/documented/data" | tail -5
      - name: Tests du moteur (marche aléatoire, absence de look-ahead)
        working-directory: lab/documented
        run: python -m unittest -v test_dsim
      - name: Qualité des données (rapports Dukascopy)
        run: |
          python - <<'PY'
          import glob, json
          for f in sorted(glob.glob("lab/documented/data/quality_*.json")):
              q = json.load(open(f)); s = q["symbols"]["EURUSD"]
              print(f.split("/")[-1], s["first"], "->", s["last"], "lignes", s["rows"], "trous>15min", s["gaps_over_15min_weekdays"], "erreurs", len(q["download"]["errors"]))
          PY
      - name: Protocole des 10 méthodes (règles fixées à l'avance)
        working-directory: lab/documented
        run: python run_doc.py data/EURUSD_*.csv.gz --out ../../results/documented
      - name: Enregistrer les résultats dans la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/documented
          git commit -qm "results(documented): backtests des 10 méthodes (run ${{ github.run_id }})" || exit 0
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"
