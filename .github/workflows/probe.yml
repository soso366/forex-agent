# Diagnostic : quel rythme Dukascopy accepte-t-il depuis GitHub ? (n'affecte pas le backtest)
name: Diagnostic Dukascopy
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Tester le rythme
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "IP runner: $(curl -s --max-time 10 https://api.ipify.org)" > probe.txt
          for d in 02 03 04 05 08 09 10 11 12 15 16 17 18 19 22; do
            for side in BID ASK; do
              U="https://datafeed.dukascopy.com/datafeed/GBPUSD/2026/05/$d/${side}_candles_min_1.bi5"
              R=$(curl -sS -D h.txt -o f.bin -w "%{http_code} %{size_download}o %{time_total}s" --max-time 30 -A "Mozilla/5.0" "$U" 2>&1)
              echo "$(date -u +%T) $d $side $R $(grep -i -E '^(retry-after|server|cf-ray|x-)' h.txt | tr -d '\r' | tr '\n' ' ')" >> probe.txt
              sleep 3
            done
          done
          echo "--- corps d'une réponse non-200 ---" >> probe.txt; head -c 400 f.bin >> probe.txt
          echo; echo "--- entêtes complets ---" >> probe.txt; cat h.txt >> probe.txt
          cat probe.txt
          git init -q r && cd r && git checkout -q -b probe && cp ../probe.txt . && git add . \
            && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm probe \
            && git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" probe
