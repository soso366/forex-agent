# Diagnostic rapide : Dukascopy est-il joignable depuis les serveurs GitHub ? (n'affecte pas le backtest)
name: Diagnostic Dukascopy
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tester un fichier Dukascopy
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          URL="https://datafeed.dukascopy.com/datafeed/EURUSD/2026/06/15/BID_candles_min_1.bi5"
          START=$(date +%s)
          RES=$(curl -sS -o f.bi5 -w "http=%{http_code} octets=%{size_download} temps=%{time_total}s" --max-time 60 "$URL" 2>&1)
          echo "$(date -u) $RES" | tee probe.txt
          python3 -c "import lzma;d=lzma.decompress(open('f.bi5','rb').read(),format=lzma.FORMAT_ALONE);print('décompressé',len(d),'octets =',len(d)//24,'bougies')" >> probe.txt 2>&1
          cat probe.txt
          git init -q r && cd r && git checkout -q -b probe && cp ../probe.txt . && git add . \
            && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm probe \
            && git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" probe
