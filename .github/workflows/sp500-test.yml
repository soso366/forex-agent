# Test I01 « zone de bruit » sur le S&P 500 (forex_lab/indices/PROTOCOLE.md).
# Téléchargement Dukascopy réparti par année sur plusieurs machines (Dukascopy ralentit fortement chaque adresse),
# données gardées dans le cache d'Actions (jamais publiées) ; seuls les résultats calculés sont enregistrés.
# Relance automatique tant que le téléchargement n'est pas complet.
name: Indices — test zone de bruit S&P 500

on:
  workflow_dispatch:
    inputs:
      attempt: {description: "Numéro de lancement (auto)", required: false, default: "1"}
  push:
    branches: [research-forex-oss]
    paths: [".github/workflows/sp500-test.yml", "forex_lab/indices/RUN"]

permissions:
  contents: write
  actions: write

concurrency:
  group: sp500-test
  cancel-in-progress: false

jobs:
  telecharger:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        year: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
        with: {ref: research-forex-oss}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pandas numpy
      - name: Restaurer le cache
        uses: actions/cache/restore@v4
        with:
          path: data/duka
          key: duka-sp500-y${{ matrix.year }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            duka-sp500-y${{ matrix.year }}-
            duka-sp500-
      - name: Télécharger l'année
        env: {PYTHONUNBUFFERED: "1"}
        run: |
          Y=${{ matrix.year }}
          S="$Y-01-01"; E="$Y-12-31"
          [ "$Y" = 2015 ] && S="2015-12-01"
          [ "$Y" = 2026 ] && E="2026-10-23"
          python -m forex_lab.indices.duka --start $S --end $E --budget-min 300 \
            --out out/session_$Y.csv.gz --status out/status_$Y.txt
      - name: Sauvegarder le cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/duka
          key: duka-sp500-y${{ matrix.year }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "session-${{ matrix.year }}", path: out/, retention-days: 3}

  calculer:
    needs: telecharger
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: research-forex-oss}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pandas numpy
      - uses: actions/download-artifact@v4
        with: {pattern: "session-*", path: out, merge-multiple: true}
      - name: Assembler et calculer
        id: calc
        run: |
          ls out
          n=$(cat out/status_*.txt 2>/dev/null | grep -c COMPLETE || true)
          echo "::notice::années complètes : $n / 12"
          if [ "$n" = 12 ]; then
            python - <<'EOF'
          import glob, pandas as pd
          df = pd.concat([pd.read_csv(f) for f in sorted(glob.glob("out/session_*.csv.gz"))], ignore_index=True)
          df = df.drop_duplicates(["jour", "m"]).sort_values(["jour", "m"])
          df.to_csv("out/session.csv.gz", index=False)
          print(f"::notice::{len(df):,} minutes, {df.jour.nunique()} jours, {df.jour.min()} → {df.jour.max()}, "
                f"prix {df.bc.iloc[0]:.1f} → {df.bc.iloc[-1]:.1f}, écart médian {float((df.ac - df.bc).median()):.2f} pt")
          EOF
            python -m forex_lab.indices.noise --session out/session.csv.gz
            echo "done=1" >> $GITHUB_OUTPUT
          fi
      - name: Enregistrer les résultats
        if: steps.calc.outputs.done == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull -q --rebase origin research-forex-oss || true
          git add forex_lab/indices/resultats.json
          git commit -m "result(indices): test I01 zone de bruit S&P 500 [skip ci]" || exit 0
          git push origin HEAD:research-forex-oss
      - name: Relancer si incomplet
        if: steps.calc.outputs.done != '1'
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          n=${{ inputs.attempt || '1' }}
          if [ "$n" -lt 10 ]; then
            gh workflow run sp500-test.yml --repo "$GITHUB_REPOSITORY" --ref research-forex-oss -f attempt=$((n + 1))
            echo "::notice::téléchargement incomplet, relance n° $((n + 1))"
          else
            echo "::error::téléchargement toujours incomplet après $n lancements"; exit 1
          fi
