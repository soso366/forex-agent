# Premier vrai backtest de la V2 sur données Dukascopy — PAPER uniquement, aucun broker, aucun argent.
#
# Se lance :
#   - avec le bouton « Run workflow » (onglet Actions de GitHub), ou
#   - automatiquement quand le fichier deploy/trigger/backtest.txt est modifié.
# Résultats : branche « results » du dépôt (dossier results/) + téléchargement « Artifacts » du run.
# Reprise : les données déjà téléchargées et l'avancement du backtest sont conservés entre deux lancements.

name: Backtest V2 (Dukascopy)

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Début AAAA-MM-JJ (vide = 6 derniers mois civils complets)"
        required: false
        default: ""
      end:
        description: "Fin AAAA-MM-JJ incluse (vide = fin du dernier mois complet)"
        required: false
        default: ""
      attempt:
        description: "Numéro de lancement (rempli automatiquement lors des reprises)"
        required: false
        default: "1"
  push:
    paths:
      - deploy/trigger/backtest.txt

permissions:
  contents: write          # pour enregistrer les résultats dans la branche « results »
  actions: write           # pour relancer automatiquement la suite tant que le travail n'est pas fini

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances (versions exactes testées)
        run: |
          pip install -r requirements.txt
          python -c "import sys,pandas,numpy,yaml;print(sys.version);print('pandas',pandas.__version__,'numpy',numpy.__version__,'yaml',yaml.__version__)"

      - name: Vérifier que le code est intact (tous les tests)
        if: ${{ (github.event.inputs.attempt || '1') == '1' }}
        run: |
          set +e
          mkdir -p results
          python -m unittest discover -s tests -v 2>&1 | tee results/tests.log
          test ${PIPESTATUS[0]} -eq 0 || { printf 'ÉCHEC\nétape : tests automatiques (voir tests.log)\n' > results/STATUS.txt; exit 1; }

      - name: Restaurer les données Dukascopy déjà téléchargées
        uses: actions/cache/restore@v4
        with:
          path: data/dukascopy_raw
          key: dukascopy-${{ github.run_id }}
          restore-keys: dukascopy-

      - name: Restaurer l'avancement d'un backtest interrompu
        uses: actions/cache/restore@v4
        with:
          path: data/backtest
          key: backtest-state-${{ github.run_id }}
          restore-keys: backtest-state-

      - name: Téléchargement + validation + backtest (une seule commande)
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Toutes les 3 minutes : publie le journal en cours sur la branche « progress » (suivi à distance)
          ( URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            P="$RUNNER_TEMP/progress"; git init -q "$P"; git -C "$P" checkout -q -b progress
            while true; do sleep 180
              [ -f results/pipeline.log ] || continue
              tail -n 300 results/pipeline.log > "$P/progress.log"; date -u > "$P/updated.txt"
              git -C "$P" add -A && git -C "$P" -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm progress && \
                git -C "$P" push -qf "$URL" progress >/dev/null 2>&1
            done ) &
          ARGS=""
          if [ -n "${{ github.event.inputs.start }}" ]; then ARGS="$ARGS --start ${{ github.event.inputs.start }}"; fi
          if [ -n "${{ github.event.inputs.end }}" ]; then ARGS="$ARGS --end ${{ github.event.inputs.end }}"; fi
          python -m forex_agent pipeline $ARGS --time-budget-min 290

      - name: Sauvegarder les données téléchargées (même en cas d'échec)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/dukascopy_raw
          key: dukascopy-${{ github.run_id }}

      - name: Sauvegarder l'avancement du backtest (même en cas d'échec)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/backtest
          key: backtest-state-${{ github.run_id }}

      - name: Enregistrer les résultats dans la branche « results »
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          [ -d results ] || { echo "Aucun résultat à enregistrer"; exit 0; }
          STAMP=$(date -u +%Y-%m-%d_%H%M)
          cd "$RUNNER_TEMP"
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --quiet --depth 1 --branch results "$URL" res 2>/dev/null; then cd res; else
            mkdir res && cd res && git init --quiet && git checkout --quiet -b results && git remote add origin "$URL"; fi
          rm -rf latest && mkdir -p latest "runs/$STAMP"
          cp -r "$GITHUB_WORKSPACE"/results/* latest/
          cp -r "$GITHUB_WORKSPACE"/results/* "runs/$STAMP/"
          git config user.name "forex-agent-bot"
          git config user.email "forex-agent-bot@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Résultats backtest $STAMP ($(head -1 latest/STATUS.txt))" || exit 0
          git push --quiet origin results

      - name: Relancer automatiquement la suite si le travail n'est pas fini
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N="${{ github.event.inputs.attempt || '1' }}"
          STATUS=$(head -1 results/STATUS.txt 2>/dev/null || echo "?")
          echo "Lancement n°$N — statut : $STATUS"
          if [ "$STATUS" = "EN COURS" ] && [ "$N" -lt 12 ]; then
            gh workflow run backtest.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f attempt=$((N+1)) -f start="${{ github.event.inputs.start }}" -f end="${{ github.event.inputs.end }}"
            echo "Suite relancée automatiquement (lancement n°$((N+1)))."
          fi

      - name: Résultats téléchargeables (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-backtest
          path: results/
          retention-days: 90
